<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}
body{margin:0;background:#101114;color:#f5f5f5}
main{max-width:1050px;margin:auto;padding:20px}
h1{font-size:52px;margin:0 0 20px}
.muted{color:#b7bac3;margin-bottom:22px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,button{background:#1a1d23;color:#fff;border:1px solid #343945;border-radius:10px;padding:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;border-bottom:1px solid #30343d;text-align:right}
th:first-child,td:first-child{text-align:left}
.cid{display:block;color:#8d93a1;font-size:12px;margin-top:3px}
.positive{color:#7ee787;font-weight:700}
.negative{color:#ff7b72}
.stale{color:#e3b341}
.error{color:#ff7b72}

.all-bots{
  margin:0 0 20px;
  border:1px solid #30343d;
  border-radius:12px;
  background:#15171c;
}

.all-bots summary{
  cursor:pointer;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
}

.all-bots-content{
  padding:0 12px 12px;
}

.comparebox{
  margin:20px 0;
  padding:14px;
  background:#fff;
  color:#111;
  border-radius:14px;
}

.date-labels{
  display:grid;
  grid-template-columns:1fr 1fr 0.8fr;
  gap:8px;
  margin-bottom:4px;
  text-align:center;
  font-size:12px;
  color:#555;
}

.date-controls{
  display:grid;
  grid-template-columns:1fr 1fr 0.8fr;
  gap:8px;
  margin-bottom:8px;
}

.date-controls button,
.date-box{
  min-width:0;
  height:35px;
  box-sizing:border-box;
  border:1px solid #343945;
  border-radius:10px;
  background:#1a1d23;
}

.date-controls button{
  width:100%;
  padding:0 6px;
}

.date-box{
  display:flex;
  align-items:center;
  padding:0 6px;
}

.date-box input[type="date"]{
  display:block;
  width:100%;
  min-width:0;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.compare-controls{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}

.compare-controls select,
.compare-controls button{
  width:100%;
  min-width:0;
}

.bot-picker{
  background:#1a1d23;
  color:#fff;
  border:1px solid #343945;
  border-radius:10px;
  padding:10px;
}

.bot-picker summary{
  cursor:pointer;
  font-size:13px;
}

#compareBots{
  max-height:250px;
  overflow-y:auto;
  margin-top:10px;
}

#compareBots label{
  display:block;
  padding:6px 2px;
  font-size:13px;
}

.chart-area{
  height:340px;
  position:relative;
}

#compareChart{
  width:100% !important;
  height:100% !important;
}

.compare-table{
  margin-top:18px;
  font-size:12px;
}

.main-table{
  font-size:13px;
}

.total-row td{
  font-weight:700;
  border-top:2px solid #f5f5f5;
}

@media(max-width:650px){
  main{padding:18px 14px}
  h1{font-size:48px}
  th,td{padding:11px 6px}
  .compare-table{font-size:12px}
  #compareBots label{font-size:12px}
  .bot-picker summary{font-size:12px}
  .main-table{font-size:12px}
  .all-bots summary{font-size:13px}
}

.events-panel{
  margin:20px 0;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
  color:#111;
}

.events-panel>summary{
  cursor:pointer;
  padding:12px 14px;
  background:#1a1d23;
  color:#fff;
  border:1px solid #343945;
  border-radius:10px;
  font-size:13px;
  list-style-position:inside;
}

.events-panel[open]>summary{
  border-radius:10px 10px 0 0;
}

.events-content{
  padding:14px;
}

.events-lock{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:12px;
}

.events-lock input{
  flex:1;
  min-width:160px;
}

.events-status{
  font-size:12px;
  color:#666;
}

.events-status.ok{
  color:#2da44e;
  font-weight:700;
}

.events-status.error{
  color:#cf222e;
  font-weight:700;
}

#eventsPrivate[hidden]{
  display:none !important;
}

.event-form{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  gap:10px;
}

.event-field{
  min-width:0;
}

.event-field label{
  display:block;
  font-size:12px;
  color:#555;
  margin:0 0 4px 2px;
}

.event-field input,
.event-field select,
.event-field textarea{
  width:100%;
  box-sizing:border-box;
}

.event-field textarea{
  min-height:70px;
  resize:vertical;
  font-family:inherit;
  background:#1a1d23;
  color:#fff;
  border:1px solid #343945;
  border-radius:10px;
  padding:10px;
}

.event-tags-wrap{
  grid-column:1/-1;
}

.event-tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.event-tag{
  border:1px solid #c8ccd3;
  background:#f4f5f7;
  color:#222;
  border-radius:999px;
  padding:7px 10px;
  cursor:pointer;
  font-size:12px;
}

.event-tag.active{
  background:#1a1d23;
  color:#fff;
  border-color:#1a1d23;
}

.event-actions{
  grid-column:1/-1;
  display:flex;
  gap:8px;
  align-items:center;
}

.event-actions button{
  min-width:90px;
}

#eventSaveStatus{
  font-size:12px;
  color:#666;
}

#eventSaveStatus.ok{
  color:#2da44e;
  font-weight:700;
}

#eventSaveStatus.error{
  color:#cf222e;
  font-weight:700;
}

.saved-events{
  margin-top:18px;
}

.saved-events h3{
  font-size:14px;
  margin:0 0 8px;
}

.saved-events table{
  font-size:12px;
}

.saved-events td,
.saved-events th{
  padding:8px 6px;
  border-bottom:1px solid #ddd;
}

.saved-events .event-note{
  text-align:left;
  max-width:260px;
  overflow-wrap:anywhere;
}

.saved-events .event-controls{
  white-space:nowrap;
}

.saved-events .event-controls button{
  padding:5px 7px;
  margin-left:4px;
  font-size:12px;
}

.tag-chip{
  display:inline-block;
  border-radius:999px;
  padding:2px 6px;
  margin:1px 2px 1px 0;
  background:#eef0f3;
  border:1px solid #d5d8de;
  font-size:11px;
  white-space:nowrap;
}

@media(max-width:650px){
  .event-form{
    grid-template-columns:1fr;
  }
  .event-tags-wrap,
  .event-actions{
    grid-column:1;
  }
  .saved-events{
    overflow-x:auto;
  }
  .saved-events table{
    min-width:620px;
  }
  .events-panel>summary{
    font-size:12px;
  }
}


#app[hidden]{
  display:none !important;
}

#siteGate[hidden]{
  display:none !important;
}

.site-gate{
  display:block;
  max-width:1050px;
  margin:0 auto;
  padding:18px 20px 0;
  box-sizing:border-box;
}

.site-gate-card{
  width:100%;
  background:#fff;
  color:#111;
  border-radius:14px;
  padding:12px 14px;
  box-sizing:border-box;
}

.site-gate-card h1{
  color:#111;
  font-size:28px;
  margin:0 0 10px;
  text-transform:lowercase;
}

.site-gate-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
}

.site-gate-row input{
  min-width:0;
  height:38px;
  box-sizing:border-box;
}

.site-gate-row button{
  height:38px;
  padding:0 14px;
}

#siteGateStatus{
  min-height:16px;
  margin-top:6px;
  font-size:11px;
  color:#666;
}

#siteGateStatus.error{
  color:#cf222e;
  font-weight:700;
}

.app-head-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}

.app-head-row .muted{
  margin-bottom:0;
  flex:1;
}

#siteLockButton{
  padding:7px 10px;
  font-size:12px;
}

.events-panel>summary,
.events-content,
.events-content label,
.saved-events h3,
.saved-events th,
.event-tag,
#eventSave,
#eventClear{
  text-transform:lowercase;
}

#eventDate{
  width:170px !important;
  max-width:170px;
  height:38px;
  padding:5px 8px;
  font-size:12px !important;
}

.event-tags{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.event-tag{
  width:100%;
  min-width:0;
  padding:8px 10px;
  text-align:left;
  white-space:nowrap;
  font-size:12px;
}

@media(max-width:650px){
  .site-gate{
    padding:12px 14px 0;
  }

  .site-gate-card{
    padding:10px 12px;
  }

  .site-gate-card h1{
    font-size:24px;
    margin-bottom:8px;
  }

  .site-gate-row input,
  .site-gate-row button{
    height:36px;
  }

  #eventDate{
    width:150px !important;
    max-width:150px;
    height:36px;
    font-size:11px !important;
  }

  .event-tags{
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    gap:7px;
  }

  .event-tag{
    padding:8px 8px;
    font-size:11px;
    text-align:left;
  }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
</head>

<body>

<div id="siteGate" class="site-gate">
  <div class="site-gate-card">
    <h1>stats 🔒</h1>

    <div class="site-gate-row">
      <input
        id="sitePassword"
        type="password"
        autocomplete="current-password"
        placeholder="password"
      >
      <button id="siteUnlockButton" type="button">unlock</button>
    </div>

    <div id="siteGateStatus"></div>
  </div>
</div>

<main id="app" hidden>

<h1>stats</h1>
<div class="app-head-row">
  <div id="updated" class="muted">loading…</div>
  <button id="siteLockButton" type="button">lock</button>
</div>

<details class="all-bots">
  <summary>All bots</summary>

  <div class="all-bots-content">

    <div class="controls">
      <input id="search" placeholder="Search bot">

      <select id="sort">
        <option value="creation">Latest</option>
        <option value="growth">Growth</option>
        <option value="messages">Messages</option>
        <option value="collectors">Collectors</option>
        <option value="name">Name</option>
      </select>
    </div>

    <table class="main-table">
      <thead>
        <tr>
          <th>bot</th>
          <th>Start</th>
          <th>Now</th>
          <th>Growth</th>
          <th>C.</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

  </div>
</details>

<div class="comparebox">

  <div class="date-labels">
    <span>From</span>
    <span>To</span>
    <span></span>
  </div>

  <div class="date-controls">
    <div class="date-box">
      <input id="fromDate" type="date">
    </div>

    <div class="date-box">
      <input id="toDate" type="date">
    </div>

    <button id="latestDate">Latest</button>
  </div>

  <div class="compare-controls">

    <select id="displayMode">
      <option value="cid">CID</option>
      <option value="name">Name</option>
    </select>

    <select id="compareMetric">
      <option value="messages">Messages</option>
      <option value="growth">Growth</option>
      <option value="collectors">Collectors</option>
    </select>

    <select id="comparePeriod">
      <option value="all">All</option>
      <option value="30">30 day</option>
      <option value="7">7 day</option>
      <option value="1">1 day</option>
    </select>

    <button id="resetZoom">Zoom 0</button>
  </div>

  <details class="bot-picker">
    <summary id="compareSummary">Bots</summary>
    <div id="compareBots"></div>
  </details>

  <div class="chart-area">
    <canvas id="compareChart"></canvas>
  </div>

  <table class="compare-table">
    <thead>
      <tr>
        <th>bot</th>
        <th>Start</th>
        <th>Now</th>
        <th>Growth</th>
      </tr>
    </thead>
    <tbody id="compareRows"></tbody>
  </table>

</div>


<details class="events-panel" id="eventsPanel">
  <summary id="eventsSummary">events tracker</summary>

  <div class="events-content">

    

    <div id="eventsPrivate" hidden>

    <div class="event-form">

      <div class="event-field">
        <label for="eventDate">date</label>
        <input id="eventDate" type="date">
      </div>

      <div class="event-field">
        <label for="eventBot">bot</label>
        <select id="eventBot">
          <option value="">select bot</option>
        </select>
      </div>

      <div class="event-field event-tags-wrap">
        <label>tags</label>
        <div id="eventTags" class="event-tags"></div>
      </div>

      <div class="event-field event-tags-wrap">
        <label for="eventNote">note (optional)</label>
        <textarea id="eventNote" placeholder="add note..."></textarea>
      </div>

      <div class="event-actions">
        <button id="eventSave" type="button" disabled>save</button>
        <button id="eventClear" type="button">clear</button>
        <span id="eventSaveStatus"></span>
      </div>

    </div>

    <div class="saved-events">
      <h3>saved events</h3>
      <table>
        <thead>
          <tr>
            <th>date</th>
            <th>bot</th>
            <th>tags</th>
            <th>note</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="eventsRows">
          <tr>
            <td colspan="5">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>

    </div>

  </div>
</details>

</main>

<script>
const fmt=new Intl.NumberFormat('nl-NL');

const state={
  bots:[],
  meta:new Map(),
  history:null,
  daily:[]
};

let compareChart=null;


function displayLabel(cid){
  if(cid==='__total__') return 'Total';
  if(cid==='__profile__') return 'profile';

  const bot=state.meta.get(cid);
  const mode=document.querySelector('#displayMode')?.value || 'cid';

  return mode==='name'
    ? (bot?.name || cid)
    : cid;
}


function dayKey(timestamp){
  return new Date(timestamp).toLocaleDateString('sv-SE');
}


function buildDailySnapshots(snapshots){
  const daily=new Map();

  snapshots.forEach(snapshot=>{
    daily.set(
      dayKey(snapshot.timestamp),
      snapshot
    );
  });

  return [...daily.entries()]
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([date,snapshot])=>({
      date,
      snapshot
    }));
}


function getDailyEntry(date){
  return state.daily.find(
    item=>item.date===date
  ) || null;
}


function getLatestEntry(){
  return state.daily.at(-1) || null;
}


function getPreviousEntry(entry){
  if(!entry) return null;

  const index=state.daily.findIndex(
    item=>item.date===entry.date
  );

  return index>0
    ? state.daily[index-1]
    : null;
}


function getSelectedRange(){
  const from=
    document.querySelector('#fromDate')?.value || '';

  const to=
    document.querySelector('#toDate')?.value || '';

  const latest=getLatestEntry();

  const endEntry=
    to
      ? getDailyEntry(to)
      : latest;

  let startEntry=null;

  if(from){
    startEntry=getDailyEntry(from);
  }else if(endEntry){
    startEntry=getPreviousEntry(endEntry);
  }

  return {
    from,
    to,
    startEntry,
    endEntry
  };
}


function getTableRows(){
  const {
    startEntry,
    endEntry
  }=getSelectedRange();

  if(!endEntry){
    return [];
  }

  const startMap=
    new Map(
      (startEntry?.snapshot.bots || [])
        .map(b=>[b.cid,b])
    );

  const endMap=
    new Map(
      (endEntry.snapshot.bots || [])
        .map(b=>[b.cid,b])
    );

  return [...state.meta.values()]
    .map(meta=>{
      const startBot=
        startMap.get(meta.cid);

      const endBot=
        endMap.get(meta.cid);

      const startMessages=
        Number.isFinite(startBot?.messages)
          ? startBot.messages
          : null;

      const endMessages=
        Number.isFinite(endBot?.messages)
          ? endBot.messages
          : null;

      const growth=
        Number.isFinite(startMessages) &&
        Number.isFinite(endMessages)
          ? endMessages-startMessages
          : null;

      return {
        cid:meta.cid,
        name:meta.name || meta.cid,
        url:meta.url,
        order:meta.creation_order ?? 9999,
        startMessages,
        messages:endMessages,
        growth,
        collectors:
          Number.isFinite(endBot?.collectors)
            ? endBot.collectors
            : null,
        stale:endBot?.stale || false
      };
    });
}


function getGraphDays(){
  let days=[...state.daily];

  const from=
    document.querySelector('#fromDate')?.value || '';

  const to=
    document.querySelector('#toDate')?.value || '';

  const period=
    document.querySelector('#comparePeriod').value;

  if(from){
    const endDate=
      to || getLatestEntry()?.date;

    days=days.filter(item=>
      item.date>=from &&
      (!endDate || item.date<=endDate)
    );

    return days;
  }

  if(to){
    days=days.filter(
      item=>item.date<=to
    );
  }

  if(period!=='all' && days.length){
    const endTime=
      new Date(
        days.at(-1).snapshot.timestamp
      ).getTime();

    const cutoff=
      endTime-
      (
        Number(period)*
        24*60*60*1000
      );

    days=days.filter(
      item=>
        new Date(
          item.snapshot.timestamp
        ).getTime()>=cutoff
    );
  }

  return days;
}


function totalForSnapshot(snapshot,metric){
  const sourceMetric=
    metric==='growth'
      ? 'messages'
      : metric;

  return (snapshot.bots||[])
    .reduce(
      (sum,bot)=>
        sum+
        (
          Number.isFinite(bot[sourceMetric])
            ? bot[sourceMetric]
            : 0
        ),
      0
    );
}


let appLoaded=false;

async function loadStatsData(){
  if(appLoaded) return;
  appLoaded=true;

  return Promise.all([
  fetch(
    'bots.json',
    {cache:'no-store'}
  ).then(r=>r.json()),

  fetch(
    'data/history.json',
    {cache:'no-store'}
  ).then(r=>r.json())
]).then(([bots,history])=>{

  state.history=history;

  bots.forEach(
    b=>state.meta.set(b.cid,b)
  );

  state.daily=
    buildDailySnapshots(
      history.snapshots || []
    );

  const latest=
    history.snapshots.at(-1);

  const previous=
    history.snapshots.at(-2);

  const prev=
    new Map(
      (previous?.bots||[])
        .map(b=>[b.cid,b])
    );

  state.bots=
    (latest?.bots||[])
      .map(b=>{
        const m=
          state.meta.get(b.cid)||{};

        return {
          ...b,
          name:m.name||b.name,
          url:m.url||b.url,
          order:
            m.creation_order??9999,
          growth:
            Number.isFinite(b.messages) &&
            Number.isFinite(
              prev.get(b.cid)?.messages
            )
              ? b.messages-
                prev.get(b.cid).messages
              : null
        };
      });

  if(latest){
    document.querySelector('#updated')
      .textContent=
        'Last updated: '+
        new Date(
          latest.timestamp
        ).toLocaleString('nl-NL');
  }else{
    document.querySelector('#updated')
      .textContent=
        'No measurements yet';
  }

  if(state.daily.length){
    const minDate=
      state.daily[0].date;

    const maxDate=
      state.daily.at(-1).date;

    document.querySelector('#fromDate')
      .min=minDate;

    document.querySelector('#fromDate')
      .max=maxDate;

    document.querySelector('#toDate')
      .min=minDate;

    document.querySelector('#toDate')
      .max=maxDate;
  }

  const compareBots=
    document.querySelector(
      '#compareBots'
    );

  compareBots.innerHTML=`
    <label>
      <input
        type="checkbox"
        id="selectAllBots"
      >
      Select all
    </label>

    <label>
      <input
        type="checkbox"
        id="totalProfile"
        value="__total__"
      >
      Total
    </label>
  ` +
  [...bots]
    .sort(
      (a,b)=>
        (b.creation_order??9999)-
        (a.creation_order??9999)
    )
    .map(b=>`
      <label>
        <input
          type="checkbox"
          value="${b.cid}"
        >
        ${displayLabel(b.cid)}
      </label>
    `)
    .join('');


  const eventBot=
    document.querySelector('#eventBot');

  if(eventBot){
    eventBot.innerHTML=
      '<option value="">select bot</option>'+
      '<option value="__profile__">profile</option>'+
      [...bots]
        .sort(
          (a,b)=>
            (b.creation_order??9999)-
            (a.creation_order??9999)
        )
        .map(
          b=>`<option value="${b.cid}">${b.name || b.cid}</option>`
        )
        .join('');
  }

  initEventsTracker();
  render();

}).catch(e=>{
  document.querySelector('#updated')
    .textContent=
      'Error: '+e.message;
});

}


function render(){
  const q=
    document.querySelector('#search')
      .value
      .toLowerCase();

  const s=
    document.querySelector('#sort')
      .value;

  const allRows=getTableRows();

  let a=
    allRows
      .filter(
        b=>
          (
            b.name+
            ' '+
            b.cid
          )
          .toLowerCase()
          .includes(q)
      );

  a.sort((x,y)=>
    s==='growth'
      ? (y.growth??-Infinity)-
        (x.growth??-Infinity)

    : s==='messages'
      ? (y.messages??-Infinity)-
        (x.messages??-Infinity)

    : s==='collectors'
      ? (y.collectors??-Infinity)-
        (x.collectors??-Infinity)

    : s==='name'
      ? x.name.localeCompare(y.name)

    : y.order-x.order
  );

  const rowsHtml=
    a.map(b=>`
      <tr>
        <td>
          ${
            b.url
              ? `<a href="${b.url}" target="_blank" style="color:inherit;text-decoration:none">${displayLabel(b.cid)}</a>`
              : displayLabel(b.cid)
          }
        </td>

        <td>
          ${
            b.startMessages==null
              ? '—'
              : fmt.format(b.startMessages)
          }
        </td>

        <td class="${b.stale?'stale':''}">
          ${
            b.messages==null
              ? '—'
              : fmt.format(b.messages)
          }
        </td>

        <td class="${
          b.growth>0
            ? 'positive'
            : b.growth<0
              ? 'negative'
              : ''
        }">
          ${
            b.growth==null
              ? '—'
              :
                (b.growth>0?'+':'')+
                fmt.format(b.growth)
          }
        </td>

        <td>
          ${
            b.collectors==null
              ? '—'
              : fmt.format(b.collectors)
          }
        </td>
      </tr>
    `).join('');

  const totalStart=
    allRows.reduce(
      (sum,b)=>sum+(b.startMessages ?? 0),
      0
    );

  const totalNow=
    allRows.reduce(
      (sum,b)=>sum+(b.messages ?? 0),
      0
    );

  const totalGrowth=
    totalNow-totalStart;

  const totalCollectors=
    allRows.reduce(
      (sum,b)=>sum+(b.collectors ?? 0),
      0
    );

  const totalHtml=`
    <tr class="total-row">
      <td>Total</td>
      <td>${fmt.format(totalStart)}</td>
      <td>${fmt.format(totalNow)}</td>
      <td class="${
        totalGrowth>0
          ? 'positive'
          : totalGrowth<0
            ? 'negative'
            : ''
      }">
        ${
          totalGrowth>0
            ? '+'
            : ''
        }${fmt.format(totalGrowth)}
      </td>
      <td>${fmt.format(totalCollectors)}</td>
    </tr>
  `;

  document.querySelector('#rows')
    .innerHTML=
      rowsHtml+totalHtml;
}

function drawCompareChart(){
  const metric=
    document.querySelector(
      '#compareMetric'
    ).value;

  const selected=
    [
      ...document.querySelectorAll(
        '#compareBots input[type="checkbox"]:checked:not(#selectAllBots)'
      )
    ]
    .map(
      i=>i.value
    );

  const realSelected=
    selected.filter(
      cid=>cid!=='__total__'
    );

  const totalSelected=
    selected.includes('__total__');

  document.querySelector(
    '#compareSummary'
  ).textContent=
    selected.length===0
      ? 'Bots'
      : totalSelected && realSelected.length===0
        ? 'Total selected'
        : totalSelected
          ? realSelected.length+' bots + Total'
          : realSelected.length+' bots selected';

  if(compareChart){
    compareChart.destroy();
    compareChart=null;
  }

  document.querySelector(
    '#compareRows'
  ).innerHTML='';

  if(
    selected.length===0 ||
    !state.history
  ){
    return;
  }

  const days=
    getGraphDays();

  if(!days.length){
    return;
  }

  const labels=
    days.map(item=>
      new Date(
        item.snapshot.timestamp
      )
      .toLocaleDateString(
        'nl-NL',
        {
          day:'2-digit',
          month:'2-digit',
          year:'2-digit'
        }
      )
    );

  const datasets=
    selected.map(cid=>{

      let rawValues;

      if(cid==='__total__'){
        rawValues=
          days.map(item=>
            totalForSnapshot(
              item.snapshot,
              metric
            )
          );
      }else{
        const sourceMetric=
          metric==='growth'
            ? 'messages'
            : metric;

        rawValues=
          days.map(item=>{
            const bot=
              (
                item.snapshot.bots||
                []
              )
              .find(
                b=>b.cid===cid
              );

            return (
              bot &&
              Number.isFinite(
                bot[sourceMetric]
              )
            )
              ? bot[sourceMetric]
              : null;
          });
      }

      let values=rawValues;

      if(metric==='growth'){
        const first=
          rawValues.find(
            value=>value!==null
          );

        values=
          rawValues.map(
            value=>
              value===null ||
              first===undefined
                ? null
                : value-first
          );
      }

      return {
        label:
          displayLabel(cid),
        data:
          values,
        tension:
          0.2,
        spanGaps:
          true
      };
    });

  compareChart=
    new Chart(
      document.querySelector(
        '#compareChart'
      ),
      {
        type:'line',
        data:{
          labels,
          datasets
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          interaction:{
            intersect:false,
            mode:'index'
          },
          plugins:{
            zoom:{
              pan:{
                enabled:true,
                mode:'x',
                threshold:25
              },
              zoom:{
                wheel:{
                  enabled:true,
                  speed:0.05
                },
                pinch:{
                  enabled:true
                },
                mode:'x'
              }
            }
          },
          scales:{
            y:{
              ticks:{
                callback:
                  value=>
                    fmt.format(
                      value
                    )
              }
            }
          }
        }
      }
    );

  const compareData=
    selected.map(cid=>{

      let rawValues;

      if(cid==='__total__'){
        rawValues=
          days.map(item=>
            totalForSnapshot(
              item.snapshot,
              metric
            )
          );
      }else{
        const sourceMetric=
          metric==='growth'
            ? 'messages'
            : metric;

        rawValues=
          days.map(item=>{
            const bot=
              (
                item.snapshot.bots||
                []
              )
              .find(
                b=>b.cid===cid
              );

            return (
              bot &&
              Number.isFinite(
                bot[sourceMetric]
              )
            )
              ? bot[sourceMetric]
              : null;
          })
          .filter(
            value=>value!==null
          );
      }

      if(!rawValues.length){
        return {
          cid,
          start:null,
          current:null,
          growth:null
        };
      }

      const first=
        rawValues[0];

      const last=
        rawValues.at(-1);

      if(metric==='growth'){
        const growth=
          last-first;

        return {
          cid,
          start:0,
          current:growth,
          growth:growth
        };
      }

      return {
        cid,
        start:first,
        current:last,
        growth:last-first
      };
    });

  const realCompareData=
    compareData.filter(
      row=>row.cid!=='__total__'
    );

  const totalStart=
    realCompareData.reduce(
      (sum,row)=>
        sum+(row.start??0),
      0
    );

  const totalCurrent=
    realCompareData.reduce(
      (sum,row)=>
        sum+(row.current??0),
      0
    );

  const totalGrowth=
    realCompareData.reduce(
      (sum,row)=>
        sum+(row.growth??0),
      0
    );

  const compareRowsHtml=
    compareData.map(row=>{

      if(
        row.start===null ||
        row.current===null
      ){
        return `
          <tr>
            <td>${displayLabel(row.cid)}</td>
            <td>—</td>
            <td>—</td>
            <td>—</td>
          </tr>
        `;
      }

      return `
        <tr>
          <td>
            ${displayLabel(row.cid)}
          </td>

          <td>
            ${fmt.format(row.start)}
          </td>

          <td>
            ${
              row.current>0 &&
              metric==='growth'
                ? '+'
                : ''
            }${fmt.format(row.current)}
          </td>

          <td
            class="${
              row.growth>0
                ? 'positive'
                : row.growth<0
                  ? 'negative'
                  : ''
            }"
          >
            ${
              row.growth>0
                ? '+'
                : ''
            }${fmt.format(row.growth)}
          </td>
        </tr>
      `;
    }).join('');

  const compareTotalHtml=
    realCompareData.length>=2
      ? `
        <tr class="total-row">
          <td>Selected total</td>

          <td>
            ${fmt.format(totalStart)}
          </td>

          <td>
            ${
              totalCurrent>0 &&
              metric==='growth'
                ? '+'
                : ''
            }${fmt.format(totalCurrent)}
          </td>

          <td
            class="${
              totalGrowth>0
                ? 'positive'
                : totalGrowth<0
                  ? 'negative'
                  : ''
            }"
          >
            ${
              totalGrowth>0
                ? '+'
                : ''
            }${fmt.format(totalGrowth)}
          </td>
        </tr>
      `
      : '';

  document.querySelector(
    '#compareRows'
  ).innerHTML=
    compareRowsHtml+
    compareTotalHtml;
}

const EVENTS_API='https://bot-events.nnharmony.workers.dev';
const EVENTS_PROFILE='alt';

const EVENT_TAGS=[
  {id:'created',label:'💟 created'},
  {id:'banned',label:'🚫 banned'},
  {id:'tagged',label:'⬆️ tagged'},
  {id:'edit',label:'☑️ edit'},
  {id:'unbanned',label:'🆗 unbanned'},
  {id:'capped',label:'🔄 capped'},
  {id:'avatar',label:'👤 avatar'},
  {id:'violation',label:'🛑 violation'},
  {id:'freeze',label:'*️⃣ freeze'},
  {id:'new',label:'🆕 new'},
  {id:'alert',label:'⚠️ alert'},
  {id:'top',label:'🔝 top'}
];

const PERSISTENT_TAGS=new Set(['banned','freeze']);

const eventsState={
  events:[],
  key:'',
  unlocked:false,
  editingId:null
};


function eventBotLabel(cid){
  if(cid==='__profile__') return 'profile';

  const bot=state.meta.get(cid);

  return bot?.name || cid;
}


function eventTagLabel(tag){
  return EVENT_TAGS.find(
    item=>item.id===tag
  )?.label || tag;
}


function selectedEventTags(){
  return [
    ...document.querySelectorAll(
      '#eventTags .event-tag.active'
    )
  ].map(
    button=>button.dataset.tag
  );
}


function setSelectedEventTags(tags){
  const selected=new Set(tags || []);

  document.querySelectorAll(
    '#eventTags .event-tag'
  )
  .forEach(button=>{
    button.classList.toggle(
      'active',
      selected.has(button.dataset.tag)
    );
  });
}


function setEventAuthUI(unlocked,message=''){
  eventsState.unlocked=unlocked;

  const save=
    document.querySelector('#eventSave');

  if(save){
    save.disabled=!unlocked;
  }

  const summary=
    document.querySelector('#eventsSummary');

  if(summary){
    summary.textContent='events tracker';
  }

  const privateContent=
    document.querySelector('#eventsPrivate');

  if(privateContent){
    privateContent.hidden=!unlocked;
  }
}


async function eventsRequest(path,options={}){
  const headers={
    ...(options.headers || {})
  };

  if(eventsState.key){
    headers['x-events-key']=eventsState.key;
  }

  headers['x-events-profile']=EVENTS_PROFILE;

  if(options.body){
    headers['content-type']='application/json';
  }

  const response=
    await fetch(
      EVENTS_API+path,
      {
        ...options,
        headers,
        cache:'no-store'
      }
    );

  let data={};

  try{
    data=await response.json();
  }catch{
    data={};
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      'Request failed'
    );
  }

  return data;
}


async function loadEvents(){
  const rows=
    document.querySelector('#eventsRows');

  try{
    const data=
      await eventsRequest('/events');

    eventsState.events=
      Array.isArray(data.events)
        ? data.events
        : [];

    renderEvents();
    loadEventForSelection();

  }catch(error){
    rows.innerHTML=`
      <tr>
        <td colspan="5" class="error">
          ${error.message}
        </td>
      </tr>
    `;
  }
}


function renderEvents(){
  const rows=
    document.querySelector('#eventsRows');

  if(!eventsState.events.length){
    rows.innerHTML=`
      <tr>
        <td colspan="5">No events yet</td>
      </tr>
    `;
    return;
  }

  rows.innerHTML=
    eventsState.events
      .map(event=>{
        const visibleTags=[...(event.tags || [])];

        if(event.status?.banned===true) visibleTags.push('banned');
        if(event.status?.freeze===true) visibleTags.push('freeze');
        if(event.status?.banned===false) visibleTags.push('__banned_off__');
        if(event.status?.freeze===false) visibleTags.push('__freeze_off__');

        const tags=visibleTags
          .map(tag=>{
            if(tag==='__banned_off__') return `<span class="tag-chip">🚫 banned off</span>`;
            if(tag==='__freeze_off__') return `<span class="tag-chip">*️⃣ freeze off</span>`;
            return `<span class="tag-chip">${eventTagLabel(tag)}</span>`;
          })
          .join('');

        return `
          <tr>
            <td>${event.date || '—'}</td>
            <td>${eventBotLabel(event.cid)}</td>
            <td>${tags || '—'}</td>
            <td class="event-note">${event.note || '—'}</td>
            <td class="event-controls">
              <button
                type="button"
                data-event-edit="${event.id}"
              >Edit</button>
              <button
                type="button"
                data-event-delete="${event.id}"
              >Delete</button>
            </td>
          </tr>
        `;
      })
      .join('');
}


function eventsForSelection(){
  const date=document.querySelector('#eventDate').value;
  const cid=document.querySelector('#eventBot').value;

  if(!date || !cid) return [];

  return eventsState.events
    .filter(event=>event.cid===cid && event.date<=date)
    .sort((a,b)=>
      a.date.localeCompare(b.date) ||
      String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))
    );
}


function persistentStateAtSelection(){
  const stateNow={banned:false,freeze:false};

  eventsForSelection().forEach(event=>{
    const status=event.status || {};
    PERSISTENT_TAGS.forEach(tag=>{
      if(typeof status[tag]==='boolean'){
        stateNow[tag]=status[tag];
      }
    });
  });

  return stateNow;
}


function dayEventTags(event){
  return (event?.tags || []).filter(tag=>!PERSISTENT_TAGS.has(tag));
}


function currentSelectionEvent(){
  const date=
    document.querySelector('#eventDate').value;

  const cid=
    document.querySelector('#eventBot').value;

  if(!date || !cid){
    return null;
  }

  return eventsState.events.find(
    event=>
      event.date===date &&
      event.cid===cid
  ) || null;
}


function loadEventForSelection(){
  const event=currentSelectionEvent();
  const persistent=persistentStateAtSelection();

  eventsState.editingId=event?.id || null;

  const selected=[
    ...dayEventTags(event),
    ...[...PERSISTENT_TAGS].filter(tag=>persistent[tag])
  ];

  setSelectedEventTags(selected);

  document.querySelector('#eventNote').value=event?.note || '';

  document.querySelector('#eventSave').textContent=
    event ? 'update' : 'save';

  const status=document.querySelector('#eventSaveStatus');
  status.textContent=event ? 'existing event loaded' : '';
  status.className='';
}


function clearEventForm(){
  eventsState.editingId=null;

  setSelectedEventTags([]);

  document.querySelector('#eventNote')
    .value='';

  document.querySelector('#eventSave')
    .textContent='save';

  document.querySelector('#eventSaveStatus')
    .textContent='';
}


async function unlockEvents(){
  const password=
    document.querySelector('#eventsPassword')
      .value;

  if(!password){
    setEventAuthUI(
      false,
      'enter password'
    );
    return;
  }

  eventsState.key=password;

  try{
    await eventsRequest(
      '/unlock',
      {method:'POST'}
    );

    sessionStorage.setItem(
      'eventsKey',
      password
    );

    document.querySelector('#eventsPassword')
      .value='';

    setEventAuthUI(
      true,
      'unlocked'
    );

    await loadEvents();

  }catch(error){
    eventsState.key='';
    sessionStorage.removeItem(
      'eventsKey'
    );

    setEventAuthUI(
      false,
      error.message
    );
  }
}


function lockEvents(){
  eventsState.key='';
  eventsState.events=[];
  eventsState.editingId=null;

  sessionStorage.removeItem(
    'eventsKey'
  );

  setEventAuthUI(
    false,
    'locked'
  );
}


async function saveEvent(){
  const date=document.querySelector('#eventDate').value;
  const cid=document.querySelector('#eventBot').value;
  const selected=selectedEventTags();
  const tags=selected.filter(tag=>!PERSISTENT_TAGS.has(tag));
  const persistent={
    banned:selected.includes('banned'),
    freeze:selected.includes('freeze')
  };

  const note=document.querySelector('#eventNote').value.trim();
  const status=document.querySelector('#eventSaveStatus');

  if(!eventsState.unlocked){
    status.textContent='unlock first';
    status.className='error';
    return;
  }

  if(!date || !cid){
    status.textContent='choose date and bot';
    status.className='error';
    return;
  }

  status.textContent='saving…';
  status.className='';

  try{
    const existing=currentSelectionEvent();

    await eventsRequest(
      '/events',
      {
        method:'POST',
        body:JSON.stringify({
          id:existing?.id || eventsState.editingId || undefined,
          date,
          cid,
          tags,
          status:persistent,
          note
        })
      }
    );

    status.textContent='saved ✓';
    status.className='ok';

    await loadEvents();

  }catch(error){
    if(error.message==='locked' || error.message==='wrong password'){
      lockEvents();
    }

    status.textContent=error.message;
    status.className='error';
  }
}

async function deleteEvent(id){
  if(!eventsState.unlocked){
    document.querySelector('#eventSaveStatus')
      .textContent='unlock first';
    return;
  }

  if(!confirm('Delete this event?')){
    return;
  }

  try{
    await eventsRequest(
      '/events/'+
      encodeURIComponent(id),
      {method:'DELETE'}
    );

    await loadEvents();

    document.querySelector('#eventSaveStatus')
      .textContent='deleted ✓';

    document.querySelector('#eventSaveStatus')
      .className='ok';

  }catch(error){
    document.querySelector('#eventSaveStatus')
      .textContent=error.message;

    document.querySelector('#eventSaveStatus')
      .className='error';
  }
}


function editEvent(id){
  const event=
    eventsState.events.find(
      item=>item.id===id
    );

  if(!event){
    return;
  }

  document.querySelector('#eventDate')
    .value=
      event.date;

  document.querySelector('#eventBot')
    .value=
      event.cid;

  eventsState.editingId=
    event.id;

  const persistent=persistentStateAtSelection();

  setSelectedEventTags([
    ...dayEventTags(event),
    ...[...PERSISTENT_TAGS].filter(tag=>persistent[tag])
  ]);

  document.querySelector('#eventNote')
    .value=
      event.note || '';

  document.querySelector('#eventSave')
    .textContent='update';

  document.querySelector('#eventsPanel')
    .open=true;

  document.querySelector('#eventSaveStatus')
    .textContent='editing event';

  document.querySelector('#eventSaveStatus')
    .className='';

  document.querySelector('#eventDate')
    .scrollIntoView({
      behavior:'smooth',
      block:'center'
    });
}


async function restoreEventSession(){
  const saved=
    sessionStorage.getItem(
      'eventsKey'
    );

  if(!saved){
    setEventAuthUI(false,'locked');
    return;
  }

  eventsState.key=saved;

  try{
    await eventsRequest(
      '/unlock',
      {method:'POST'}
    );

    setEventAuthUI(
      true,
      'unlocked'
    );

    await loadEvents();

  }catch{
    eventsState.key='';
    sessionStorage.removeItem(
      'eventsKey'
    );

    setEventAuthUI(
      false,
      'locked'
    );
  }
}


function initEventsTracker(){
  const tagBox=
    document.querySelector('#eventTags');

  if(!tagBox){
    return;
  }

  tagBox.innerHTML=
    EVENT_TAGS
      .map(tag=>`
        <button
          class="event-tag"
          type="button"
          data-tag="${tag.id}"
        >${tag.label}</button>
      `)
      .join('');

  const today=
    new Date()
      .toLocaleDateString('sv-SE');

  const latestDate=
    getLatestEntry()?.date ||
    today;

  document.querySelector('#eventDate')
    .value=
      latestDate;

  document.querySelector('#eventDate')
    .min=
      state.daily[0]?.date || '';

  document.querySelector('#eventDate')
    .max=
      today;

  tagBox.addEventListener(
    'click',
    event=>{
      const button=
        event.target.closest(
          '.event-tag'
        );

      if(!button){
        return;
      }

      button.classList.toggle(
        'active'
      );
    }
  );

  document.querySelector('#eventDate')
    .addEventListener(
      'change',
      loadEventForSelection
    );

  document.querySelector('#eventBot')
    .addEventListener(
      'change',
      loadEventForSelection
    );

  document.querySelector('#eventSave')
    .addEventListener(
      'click',
      saveEvent
    );

  document.querySelector('#eventClear')
    .addEventListener(
      'click',
      ()=>{
        clearEventForm();
        loadEventForSelection();
      }
    );

  document.querySelector('#eventsRows')
    .addEventListener(
      'click',
      event=>{
        const edit=
          event.target.closest(
            '[data-event-edit]'
          );

        const del=
          event.target.closest(
            '[data-event-delete]'
          );

        if(edit){
          editEvent(
            edit.dataset.eventEdit
          );
        }

        if(del){
          deleteEvent(
            del.dataset.eventDelete
          );
        }
      }
    );

  if(eventsState.unlocked){
    loadEvents();
  }
}


async function siteUnlock(){
  const password=
    document.querySelector('#sitePassword').value;

  const status=
    document.querySelector('#siteGateStatus');

  if(!password){
    status.textContent='enter password';
    status.className='error';
    return;
  }

  status.textContent='unlocking…';
  status.className='';

  try{
    const response=
      await fetch(
        EVENTS_API+'/unlock',
        {
          method:'POST',
          headers:{
            'x-events-key':password,
            'x-events-profile':EVENTS_PROFILE
          },
          cache:'no-store'
        }
      );

    const data=
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error || 'wrong password'
      );
    }

    eventsState.key=password;
    eventsState.unlocked=true;

    sessionStorage.setItem(
      'eventsKey',
      password
    );

    document.querySelector('#siteGate').hidden=true;
    document.querySelector('#app').hidden=false;

    setEventAuthUI(true,'unlocked');

    await loadStatsData();

  }catch(error){
    eventsState.key='';
    eventsState.unlocked=false;

    sessionStorage.removeItem('eventsKey');

    status.textContent=
      (error.message || 'unlock failed').toLowerCase();

    status.className='error';
  }
}


async function restoreSiteSession(){
  const saved=
    sessionStorage.getItem('eventsKey');

  if(!saved){
    return;
  }

  document.querySelector('#sitePassword').value=saved;
  await siteUnlock();
}


function siteLock(){
  eventsState.key='';
  eventsState.unlocked=false;
  eventsState.events=[];

  sessionStorage.removeItem('eventsKey');

  location.reload();
}


document.querySelector('#siteUnlockButton')
  .addEventListener(
    'click',
    siteUnlock
  );


document.querySelector('#sitePassword')
  .addEventListener(
    'keydown',
    event=>{
      if(event.key==='Enter'){
        siteUnlock();
      }
    }
  );


document.querySelector('#siteLockButton')
  .addEventListener(
    'click',
    siteLock
  );


restoreSiteSession();

</script>

</body>
</html>
